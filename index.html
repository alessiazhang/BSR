const RISKS={"7603563802": {"level": "high", "tag": "球队IP", "desc": "图片含皇家贝蒂斯 Real Betis 球队字样及队徽"}, "7630763186": {"level": "high", "tag": "卡通IP", "desc": "图片含宝可梦 POKEMON 卡通形象及字样"}, "7597710417": {"level": "high", "tag": "影视IP", "desc": "图片为《蝙蝠侠》小丑 JOKER 角色紫色西装造型"}};
const G2_MEN=['标码','大码'];
const G2_KID=['男童','女童','男婴','女婴'];
const GI=['男装','童装'];
let curG=GI[0];
let curU=null;   // 二级tab
let curOp='';    // 负责人筛选，空=全部
let curCat='';   // 类目筛选，空=全部
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function curOps(){return [...new Set(ITEMS.filter(x=>x.g1===curG).map(x=>x.op))].filter(Boolean)}
function subTabs(g){return g==='男装'?G2_MEN:G2_KID}
function subBase(){
  let list=ITEMS.filter(x=>x.g1===curG);
  if(curU)list=list.filter(x=>x.g2===curU);
  if(curOp)list=list.filter(x=>x.op===curOp);
  return list;
}
function subItems(){
  let list=subBase();
  if(curCat)list=list.filter(x=>x.cat===curCat);
  return list;
}
function cardHTML(x){
  const imgs=x.images.length?x.images.map((f,i)=>`<img src="${esc(f)}" alt="${esc(x.cat)}参考图${i+1}" data-zoom>`).join(''):'<div style="padding:30px;color:#8892a3">暂无参考图</div>';
  const p0=x.pri==='P0'?'<span class="pri-badge">高优</span>':'';
  const rk=x.risk;
  const badge=rk?`<span class="risk-badge ${rk.level}" title="${esc(rk.desc)}">${rk.level==='high'?'侵权风险高':'建议复核'}</span>`:'';
  const note=rk?`<div class="risk-note ${rk.level}">⚠️ ${esc(rk.tag)}：${esc(rk.desc)}</div>`:'';
  return `<article class="card${rk?' r-'+rk.level:''}">${p0}<div class="card-head"><div class="task" data-copy="${esc(x.zp)}" title="点击复制商品编号">商品编号：${esc(x.zp)}${badge}</div></div><div class="gallery${x.images.length===1?' single':x.images.length===2?' two':''}">${imgs}</div><div class="meta"><div class="label">上新路径</div><div class="category" data-copy="${esc(x.catpath)}" data-noreplace title="点击复制类目上新路径">${esc(x.catpath)}</div>${note}</div></article>`;
}
function render(){
  const data=subItems();
  const g=$('#groups');
  if(!data.length){g.innerHTML='<div class="empty">该分组暂无商品</div>';return}
  // 按类目分组
  const byCat={};
  data.forEach(x=>{(byCat[x.cat]=byCat[x.cat]||[]).push(x)});
  const cats=Object.keys(byCat).sort((a,b)=>byCat[b].length-byCat[a].length);
  g.innerHTML=cats.map(c=>{
    const list=byCat[c].slice().sort((a,b)=>(a.pri==='P0'?0:1)-(b.pri==='P0'?0:1));
    return `<div class="group-title">${esc(c)}<span class="gt-count">${list.length}款</span></div><div class="grid">${list.map(cardHTML).join('')}</div>`;
  }).join('');
}
function renderTabs(){
  $('#tabs').innerHTML=GI.map(t=>`<button class="tab${t===curG?' active':''}" data-t="${esc(t)}">${esc(t)}<span class="cnt">${ITEMS.filter(x=>x.g1===t).length}</span></button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{curG=b.dataset.t;curU=subTabs(curG)[0];renderTabs();renderOpFilter();renderUTabs();renderCatFilter();render()});
}
function renderUTabs(){
  const st=subTabs(curG);
  $('#utabs').innerHTML=st.map(t=>{
    const cnt=ITEMS.filter(x=>x.g1===curG&&x.g2===t&&(!curOp||x.op===curOp)).length;
    return `<button class="utab${t===curU?' active':''}" data-t="${esc(t)}">${esc(t)}<span class="cnt">${cnt}</span></button>`;
  }).join('');
  $('#utabs').querySelectorAll('.utab').forEach(b=>b.onclick=()=>{curU=b.dataset.t;renderUTabs();renderCatFilter();render()});
}
function renderOpFilter(){
  const ops=curOps();
  if(curOp&&!ops.includes(curOp))curOp='';
  $('#opsel').innerHTML=['',...ops].map(v=>`<option value="${esc(v)}"${v===curOp?' selected':''}>${v?esc(v):'全部'}</option>`).join('');
  $('#opsel').onchange=e=>{curOp=e.target.value;renderUTabs();renderCatFilter();render()};
}

function renderCatFilter(){
  const data=subBase();
  const byCat={};
  data.forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+1);
  const cats=Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
  if(curCat&&!cats.includes(curCat))curCat='';
  $('#catsel').innerHTML=['',...cats].map(v=>`<option value="${esc(v)}"${v===curCat?' selected':''}>${v?esc(v):'全部类目'}</option>`).join('');
  $('#catsel').onchange=e=>{curCat=e.target.value;render()};
}
let curImgSrc='';
function copyText(txt){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(txt)}return new Promise((res,rej)=>{try{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();res()}catch(e){rej(e)}})}
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1500)}
document.addEventListener('click',e=>{
  const z=e.target.closest('[data-zoom]');
  if(z){curImgSrc=z.src;$('#modalImg').src=z.src;$('#modal').classList.add('open');return}
  const c=e.target.closest('[data-copy]');
  if(c){copyText(c.dataset.copy).then(()=>{if(c.hasAttribute('data-noreplace')){c.classList.add('copied');toast('已复制：'+c.dataset.copy);setTimeout(()=>c.classList.remove('copied'),1200)}else{const t=c.textContent;c.textContent='已复制 ✓';c.classList.add('copied');setTimeout(()=>{c.textContent=t;c.classList.remove('copied')},1200)}}).catch(()=>alert('复制失败，请手动复制'));}
});
$('#closeModal').onclick=()=>$('#modal').classList.remove('open');
$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};
$('#gsearch').onclick=e=>{e.stopPropagation();const abs=curImgSrc&&curImgSrc.startsWith('http')?curImgSrc:(location.origin&&location.origin!=='null'&&!location.origin.startsWith('file'))?location.origin+'/'+curImgSrc.replace(/^\.?\//,''):'';window.open(abs?'https://lens.google.com/uploadbyurl?url='+encodeURIComponent(abs):'https://lens.google.com/','_blank')};
renderTabs();renderUTabs();renderOpFilter();renderCatFilter();render();
</script>
